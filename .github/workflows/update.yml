name: Update Tunables

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Check JavaScript syntax
        run: npm run check

      - name: Prepare dictionary
        run: |
          DICTIONARY_ENABLED=$(node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('config/config.json','utf8')); process.stdout.write(c.dictionary?.enabled === false ? 'false' : 'true');")
          COMPILE_ON_START=$(node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('config/config.json','utf8')); process.stdout.write(c.dictionary?.compile_on_start === true ? 'true' : 'false');")

          if [ "$DICTIONARY_ENABLED" = "false" ]; then
            echo "[dictionary] Dictionary disabled by config."
            exit 0
          fi

          if [ "$COMPILE_ON_START" = "true" ]; then
            echo "[dictionary] compile_on_start enabled."
            echo "[dictionary] Building local GTA V dictionary..."
            node src/build-dictionary.js
            exit 0
          fi

          if [ ! -f "data/dictionaries/dictionary-tunables.json" ] || \
             [ ! -f "data/dictionaries/dictionary-other.json" ] || \
             [ ! -f "data/dictionaries/dictionary-jobs.json" ]; then
            echo "[dictionary] Existing dictionary is incomplete or missing."
            echo "[dictionary] Building local GTA V dictionary..."
            node src/build-dictionary.js
            exit 0
          fi

          echo "[dictionary] compile_on_start disabled."
          echo "[dictionary] Existing dictionary found."
          echo "[dictionary] Using existing dictionary without recompiling."

      - name: Create data directories
        run: |
          mkdir -p data/state
          mkdir -p data/current
          mkdir -p history
          mkdir -p changelogs

      - name: Update tunables
        env:
          TUNABLES_AES_KEY: ${{ secrets.TUNABLES_AES_KEY }}
        run: node src/index.js

      - name: Check Rockstar Newswire
        run: node src/newswire.js

      - name: Send Discord notifications
        if: success()
        continue-on-error: true
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node src/notify.js

      - name: Commit changes
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update tunables"
            git pull --rebase origin main
            git push
          fi
